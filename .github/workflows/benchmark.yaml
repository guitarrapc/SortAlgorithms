name: Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark:
        type: choice
        description: Specify benchmark name to run. Use "*" to run all benchmarks.
        default: "*"
        options:
          - "*"
          - "*DistributionBenchmark*"
          - "*ExchangeBenchmark*"
          - "*HeapBenchmark*"
          - "*InsertionBenchmark*"
          - "*MergeBenchmark*"
          - "*MergeSlowBenchmark*"
          - "*NetworkBenchmark*"
          - "*PartitionBenchmark*"
          - "*ScalingBenchmark*"
          - "*SelectionBenchmark*"
          - "*TreeBenchmark*"
          - "*IntKeyBenchmark*"
          - "*StringBenchmark*"
      allow-any-cpu:
        type: boolean
        description: Skip the AMD EPYC 9V74 CPU requirement check.
        default: false

jobs:
  benchmark:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # ScalingBenchmark (2^14 to 2^20 elements) takes most of a full run; the limit leaves room for a slower runner.
    timeout-minutes: 180
    steps:
      - name: CPU Info
        run: |
          echo "=== CPU info (pre-benchmark) ==="
          grep -m1 'model name' /proc/cpuinfo
          lscpu
          echo "=== AVX512 info ==="
          grep -o 'avx512[a-z0-9_]*' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      # Fail before setup-dotnet and build when the runner has the wrong CPU.
      # Program.cs repeats this check (RequiredCpu); keep the two values in sync.
      - name: Check runner CPU
        if: ${{ !inputs.allow-any-cpu }}
        run: |
          model=$(sed -n '/^model name/{s/^[^:]*:[[:space:]]*//p;q;}' /proc/cpuinfo)
          shopt -s nocasematch
          if [[ "${model}" != *"${REQUIRED_CPU}"* ]]; then
            echo "::error::Benchmark requires a CPU containing '${REQUIRED_CPU}', but this runner has '${model:-(unknown)}'. Re-run the job to get another runner, or run the workflow with allow-any-cpu checked."
            exit 1
          fi
          echo "::notice::CPU OK: ${model}"
        env:
          REQUIRED_CPU: EPYC 9V74
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
        with:
          dotnet-version: 11.0.x
      - name: dotnet build
        run: dotnet build -c Release
      - name: benchmark
        id: benchmark
        run: |
          dotnet run -c Release --no-build --no-launch-profile --project ./src/SortAlgorithm.Benchmark/SortAlgorithm.Benchmark.csproj -- --filter "${FILTER}" ${ALLOW_ANY_CPU}
          echo "result=success" >> $GITHUB_OUTPUT
        env:
          FILTER: ${{ inputs.benchmark == '*' && '*Benchmark*' || inputs.benchmark }}
          ALLOW_ANY_CPU: ${{ inputs.allow-any-cpu && '--allow-any-cpu' || '' }}
      - name: Check benchmark result
        if: ${{ steps.benchmark.outputs.result != 'success' }}
        run: exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: BenchmarkDotNet.Artifacts
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: error

      - name: Output results to JobSummary
        run: |
          for file in $(find BenchmarkDotNet.Artifacts/results -name "*-report-github.md" | sort | head -n 1); do
            machine_info=$(sed -n 's/^[[:space:]]*//; /^\|/p' "$file" | grep -v "|")
            echo "$machine_info" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

          for file in $(find BenchmarkDotNet.Artifacts/results -name "*-report-github.md" | sort); do
            title=$(basename "$file" .md | sed 's/-report-github//')
            content=$(sed -n 's/^[[:space:]]*//; /^\|/p' "$file" | grep "|")
            echo "## $title" >> $GITHUB_STEP_SUMMARY
            echo "$content" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

  update-readme:
    name: update README benchmark results
    needs: [benchmark]
    if: ${{ inputs.benchmark == '*' && needs.benchmark.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.SYNCED_ACTIONS_BOT_APPID }}
          private-key: ${{ secrets.SYNCED_ACTIONS_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
        with:
          dotnet-version: 11.0.x
      - name: Download benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BenchmarkDotNet.Artifacts
          path: artifacts
      - name: Convert benchmark results
        run: dotnet run --file .github/scripts/BenchmarkData.cs -- convert --artifacts artifacts --repo . --out "${RUNNER_TEMP}/run.json" --run-url "${RUN_URL}" --commit "${GITHUB_SHA}"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Update README benchmark section
        run: |
          dotnet run --file .github/scripts/UpdateBenchmarkReadme.cs -- \
            artifacts \
            README.md \
            "${RUN_URL}" \
            --run "${RUNNER_TEMP}/run.json" \
            --image-dir .github/images/benchmark \
            --site-url "${SITE_URL}"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Commit README benchmark results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github-actions:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          if [[ -z "$(git status --porcelain -- README.md .github/images/benchmark)" ]]; then
            echo "README unchanged, skipping commit"
            exit 0
          fi

          git add README.md .github/images/benchmark
          git commit -m 'docs: update README benchmark results' -m "updated in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-data:
    name: publish benchmark data
    needs: [benchmark]
    if: ${{ inputs.benchmark == '*' && needs.benchmark.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: benchmark-data
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.SYNCED_ACTIONS_BOT_APPID }}
          private-key: ${{ secrets.SYNCED_ACTIONS_BOT_PRIVATE_KEY }}
          permission-contents: write
      # Full history: the first publish imports past results from the README history.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
        with:
          dotnet-version: 11.0.x
      - name: Download benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BenchmarkDotNet.Artifacts
          path: artifacts
      - name: Convert benchmark results
        run: dotnet run --file .github/scripts/BenchmarkData.cs -- convert --artifacts artifacts --repo . --out "${RUNNER_TEMP}/run.json" --run-url "${RUN_URL}" --commit "${GITHUB_SHA}"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Publish to the benchmark-data branch
        shell: bash
        run: |
          set -euo pipefail
          # Outside the checkout: main tracks its own data/ folder.
          data="${RUNNER_TEMP}/benchmark-data"
          remote="https://github-actions:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git ls-remote --exit-code --heads "${remote}" benchmark-data > /dev/null; then
            git clone --depth 1 --branch benchmark-data "${remote}" "${data}"
          else
            echo "::notice::benchmark-data does not exist yet; creating it with the results in the README history."
            git init -b benchmark-data "${data}"
            git -C "${data}" remote add origin "${remote}"
            mkdir -p "${data}/runs"
            dotnet run --file .github/scripts/BenchmarkData.cs -- import-readme --repo . --out-dir "${data}/runs"
            cat > "${data}/README.md" <<'MD'
          # benchmark-data

          Benchmark results published by the Benchmark workflow on `main` and read by the benchmark site.
          `runs/` holds one file per run; `index.json` and `history.json` are regenerated on every publish.
          Do not edit by hand. See `.github/docs/references/benchmark_site.md` on `main`.
          MD
          fi
          id="$(jq -r .id "${RUNNER_TEMP}/run.json")"
          cp "${RUNNER_TEMP}/run.json" "${data}/runs/${id}.json"
          dotnet run --file .github/scripts/BenchmarkData.cs -- index --data "${data}"
          git -C "${data}" config user.name "github-actions[bot]"
          git -C "${data}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${data}" add -A
          git -C "${data}" commit -m "data: benchmark run ${id}" -m "published from ${RUN_URL}"
          git -C "${data}" push origin HEAD:benchmark-data
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy-site:
    name: deploy benchmark site
    needs: [publish-data]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
