name: Build Dotnet

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
        with:
          dotnet-version: 10.0.x
      - name: dotnet build
        run: dotnet build -c Release
      - name: dotnet test
        run: dotnet test -c Release
      - name: dotnet publish
        run: dotnet publish -c Release
