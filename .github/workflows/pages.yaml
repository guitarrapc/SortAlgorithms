name: Benchmark Site

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - "main"
    paths:
      - "site/**"
      - ".github/workflows/pages.yaml"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check data branch
        id: data
        run: |
          if git ls-remote --exit-code --heads origin benchmark-data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::benchmark-data branch not found; deploying the site without data."
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ steps.data.outputs.exists == 'true' }}
        with:
          ref: benchmark-data
          path: _data
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          if [[ -d _data ]]; then
            mkdir -p _site/data
            cp -R _data/index.json _data/history.json _data/runs _site/data/
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
